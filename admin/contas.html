<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contas · Trovalim</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../platform.css">
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<nav class="pnav">
  <div class="pnav-left">
    <a href="../admin/" class="pnav-logo">
      <img src="../logo_gt.png" alt="Trovalim">
      <span class="pnav-logo-text">Trovalim</span>
    </a>
    <div class="pnav-sep"></div>
    <div class="pnav-tabs">
      <a href="../admin/" class="pnav-tab">Projetos</a>
      <a href="clientes.html" class="pnav-tab">Clientes</a>
      <a href="contas.html" class="pnav-tab active">Contas</a>
    </div>
  </div>
  <div class="pnav-user">
    <span class="pnav-name" id="userName"></span>
    <button class="btn-logout" id="logoutBtn">Sair</button>
  </div>
</nav>

<div class="page">
  <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <div>
      <h1 class="page-title">Contas</h1>
      <p class="page-subtitle" id="pageSubtitle">Gerenciamento de acesso à plataforma</p>
    </div>
    <button class="btn btn-primary" id="newAccountBtn" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova Conta
    </button>
  </div>

  <div class="alert alert-error" id="pageErr"></div>

  <div class="card" style="padding:0">
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Papel</th>
            <th style="width:160px"></th>
          </tr>
        </thead>
        <tbody id="accountsBody">
          <tr><td colspan="4"><div class="empty-state"><div class="empty-state-sub">Carregando…</div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── NEW / EDIT ACCOUNT MODAL ── -->
<div class="modal-backdrop" id="accountModal">
  <div class="modal" style="max-width:480px">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="modalTitle">Nova Conta</div>

    <div class="alert alert-error" id="modalErr"></div>

    <div class="form-group">
      <label class="form-label">Nome</label>
      <input type="text" class="form-input" id="acc-name" placeholder="Nome completo">
    </div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-input" id="acc-email" placeholder="email@exemplo.com">
    </div>
    <div class="form-group" id="acc-password-group">
      <label class="form-label">Senha</label>
      <input type="password" class="form-input" id="acc-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label">Papel</label>
      <select class="form-select" id="acc-role">
        <option value="client">Client — acesso apenas ao próprio projeto</option>
        <option value="manager">Manager — acesso total ao admin, exceto contas</option>
      </select>
      <div class="form-help">Para promover alguém a Owner, isso deve ser feito manualmente por segurança.</div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave">Salvar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  try { firebase.initializeApp(firebaseConfig); } catch(e) {}

  const auth = firebase.auth();
  const db   = firebase.firestore();
  let allAccounts = [], unsub, currentUid = null, iAmOwner = false, editingUid = null;

  showLoading(true);

  auth.onAuthStateChanged(async user => {
    if (!user) { location.href = '../login.html'; return; }

    const data = await resolveUserData(user);
    if (!isStaffRole(data.role)) { location.href = '../portal/'; return; }

    currentUid = user.uid;
    iAmOwner   = normRole(data.role) === 'owner';
    document.getElementById('userName').textContent = data.name || user.email;

    if (iAmOwner) {
      document.getElementById('newAccountBtn').style.display = 'inline-flex';
    } else {
      document.getElementById('pageSubtitle').textContent = 'Somente visualização — apenas o Owner pode criar, editar ou excluir contas.';
    }

    unsub = db.collection('users').onSnapshot(s => {
      showLoading(false);
      allAccounts = s.docs.map(d => ({ uid: d.id, ...d.data() }))
                          .sort((a, b) => (a.name || a.email || '').localeCompare(b.name || b.email || ''));
      renderAccounts();
    }, e => {
      showLoading(false);
      showPageErr('Erro ao carregar contas: ' + (e.code || e.message));
    });
  });

  function renderAccounts() {
    const tbody = document.getElementById('accountsBody');
    if (!allAccounts.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="empty-state-sub">Nenhuma conta encontrada.</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = allAccounts.map(u => `
      <tr>
        <td style="font-weight:500">${esc(u.name || '—')}</td>
        <td style="color:var(--muted);font-size:.82rem">${esc(u.email || '—')}</td>
        <td>${roleBadge(u.role)}</td>
        <td>
          ${iAmOwner ? `
            <div style="display:flex;gap:1rem;justify-content:flex-end">
              <a href="#" class="link-btn" onclick="openEdit('${u.uid}');return false">Editar</a>
              ${u.uid !== currentUid ? `<a href="#" class="link-btn" style="color:#DC2626" onclick="deleteAccount('${u.uid}','${esc(u.name || u.email || '')}');return false">Excluir</a>` : ''}
            </div>
          ` : ''}
        </td>
      </tr>`).join('');
  }

  function roleBadge(role) {
    const map = {
      owner:   { l: 'Owner',   bg: '#F5EDD9', c: '#3D0B12' },
      manager: { l: 'Manager', bg: '#DBEAFE', c: '#1D4ED8' },
      client:  { l: 'Client',  bg: '#F3F4F6', c: '#374151' },
    };
    const v = map[normRole(role)] || { l: role || '—', bg: '#F3F4F6', c: '#374151' };
    return `<span class="badge" style="background:${v.bg};color:${v.c}">${v.l}</span>`;
  }

  /* ── MODAL: CREATE / EDIT ── */
  document.getElementById('newAccountBtn').addEventListener('click', () => openModal(null));
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('accountModal').addEventListener('click', e => {
    if (e.target === document.getElementById('accountModal')) closeModal();
  });

  function openModal(uid) {
    editingUid = uid;
    hideModalErr();
    const acc = uid ? allAccounts.find(u => u.uid === uid) : null;

    document.getElementById('modalTitle').textContent = acc ? 'Editar Conta' : 'Nova Conta';
    document.getElementById('acc-name').value  = acc?.name  || '';
    document.getElementById('acc-email').value = acc?.email || '';
    document.getElementById('acc-email').disabled = !!acc;
    document.getElementById('acc-password-group').style.display = acc ? 'none' : 'block';
    document.getElementById('acc-password').value = '';
    document.getElementById('acc-role').value = (acc && normRole(acc.role) === 'manager') ? 'manager' : 'client';

    document.getElementById('accountModal').classList.add('show');
    document.getElementById('acc-name').focus();
  }

  function openEdit(uid) { openModal(uid); }

  function closeModal() {
    document.getElementById('accountModal').classList.remove('show');
    editingUid = null;
  }

  document.getElementById('modalSave').addEventListener('click', async () => {
    const name  = document.getElementById('acc-name').value.trim();
    const email = document.getElementById('acc-email').value.trim();
    const pass  = document.getElementById('acc-password').value;
    const role  = document.getElementById('acc-role').value;

    if (!name)  { showModalErr('O nome é obrigatório.'); return; }
    if (!email) { showModalErr('O e-mail é obrigatório.'); return; }

    const btn = document.getElementById('modalSave');
    btn.disabled = true; btn.textContent = 'Salvando…';

    try {
      if (editingUid) {
        await db.collection('users').doc(editingUid).update({ name, role });
      } else {
        if (pass.length < 6) { throw { code: 'weak-password', message: 'A senha deve ter pelo menos 6 caracteres.' }; }
        await createAccount(name, email, pass, role);
      }
      closeModal();
    } catch(e) {
      showModalErr(accountErrMsg(e));
    }

    btn.disabled = false; btn.textContent = 'Salvar';
  });

  // Cria a conta em um app Firebase secundário para não substituir a sessão
  // do admin logado (createUserWithEmailAndPassword loga automaticamente
  // como o novo usuário no app em que é chamado).
  async function createAccount(name, email, password, role) {
    const secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary-' + Date.now());
    try {
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
      await db.collection('users').doc(cred.user.uid).set({ name, email, role });
      await secondaryApp.auth().signOut();
    } finally {
      await secondaryApp.delete();
    }
  }

  async function deleteAccount(uid, label) {
    if (!confirm(`Excluir o acesso de "${label}"?\n\nIsso remove os dados da conta na plataforma, mas o login no Firebase Authentication precisa ser removido separadamente pelo Console do Firebase.`)) return;
    try {
      await db.collection('users').doc(uid).delete();
    } catch(e) {
      showPageErr('Erro ao excluir conta: ' + (e.code || e.message));
    }
  }

  function accountErrMsg(e) {
    const m = {
      'auth/email-already-in-use': 'Este e-mail já está em uso.',
      'auth/invalid-email': 'E-mail inválido.',
      'weak-password': 'A senha deve ter pelo menos 6 caracteres.',
      'auth/weak-password': 'A senha deve ter pelo menos 6 caracteres.',
    };
    return m[e.code] || e.message || 'Erro ao salvar a conta.';
  }

  function showModalErr(msg) {
    const el = document.getElementById('modalErr');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideModalErr() { document.getElementById('modalErr').classList.remove('show'); }

  function showPageErr(msg) {
    const el = document.getElementById('pageErr');
    el.textContent = msg;
    el.classList.add('show');
  }

  /* ── HELPERS ── */
  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('show', v); }

  async function resolveUserData(user) {
    let snap = await db.collection('users').doc(user.uid).get().catch(() => null);
    if (snap?.exists) return snap.data() || {};
    const q = await db.collection('users').where('email', '==', user.email).limit(1).get().catch(() => null);
    if (q && !q.empty) return q.docs[0].data() || {};
    snap = await db.collection('users').doc(user.email).get().catch(() => null);
    if (snap?.exists) return snap.data() || {};
    return {};
  }

  function normRole(role) {
    return String(role || '').trim().toLowerCase();
  }
  function isStaffRole(role) {
    return ['owner', 'manager'].includes(normRole(role));
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    if (unsub) unsub();
    auth.signOut().then(() => location.href = '../login.html');
  });
</script>
</body>
</html>
