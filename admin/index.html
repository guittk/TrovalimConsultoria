<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin · Trovalim</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../platform.css">
  <style>
    .client-preview {
      display: none;
      margin-top: .75rem;
      padding: .75rem 1rem;
      background: rgba(201,169,110,.08);
      border: 1px solid rgba(201,169,110,.25);
      font-size: .82rem;
      color: var(--graphite);
      gap: .6rem;
      align-items: center;
    }
    .client-preview.show { display: flex; }
    .client-preview-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--wine);
      display: flex; align-items: center; justify-content: center;
      color: var(--gold); font-family: var(--serif); font-size: .85rem;
      flex-shrink: 0;
    }
    .client-preview-name { font-weight: 500; }
    .client-preview-email { font-size: .75rem; color: var(--muted); }
    .users-loading {
      text-align: center; padding: .6rem;
      font-size: .78rem; color: var(--muted);
    }
    .np-desc-count {
      font-size: .7rem; color: var(--muted);
      text-align: right; margin-top: .3rem;
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<nav class="pnav">
  <div class="pnav-left">
    <a href="../admin/" class="pnav-logo">
      <img src="../logo_gt.png" alt="Trovalim">
      <span class="pnav-logo-text">Trovalim</span>
    </a>
    <div class="pnav-sep"></div>
    <div class="pnav-tabs">
      <a href="../admin/" class="pnav-tab active">Projetos</a>
      <a href="clientes.html" class="pnav-tab">Clientes</a>
    </div>
  </div>
  <div class="pnav-user">
    <span class="pnav-name" id="userName"></span>
    <button class="btn-logout" id="logoutBtn">Sair</button>
  </div>
</nav>

<div class="page">
  <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <div>
      <h1 class="page-title">Projetos</h1>
      <p class="page-subtitle">Central de clientes e projetos — atualização em tempo real</p>
    </div>
    <button class="btn btn-primary" id="newProjectBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Novo Projeto
    </button>
  </div>

  <div class="toolbar">
    <input type="text" class="toolbar-search" id="searchInput" placeholder="Buscar por projeto ou cliente…">
    <select class="toolbar-select" id="statusFilter">
      <option value="">Todos os status</option>
      <option value="em-andamento">Em Andamento</option>
      <option value="aguardando-cliente">Aguardando Cliente</option>
      <option value="em-revisao">Em Revisão</option>
      <option value="concluido">Concluído</option>
      <option value="pausado">Pausado</option>
    </select>
  </div>

  <div class="card" style="padding:0">
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Projeto</th>
            <th>Descrição</th>
            <th>Status</th>
            <th style="width:130px">Progresso</th>
            <th style="width:90px"></th>
          </tr>
        </thead>
        <tbody id="projectsBody">
          <tr><td colspan="6"><div class="empty-state"><div class="empty-state-sub">Carregando…</div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── NEW PROJECT MODAL ── -->
<div class="modal-backdrop" id="newProjectModal">
  <div class="modal" style="max-width:580px">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title">Novo Projeto</div>

    <div class="alert alert-error" id="modalErr"></div>

    <!-- Nome -->
    <div class="form-group">
      <label class="form-label">Nome do Projeto *</label>
      <input type="text" class="form-input" id="np-name" placeholder="Ex: Consultoria de Carreira Q3" maxlength="120">
    </div>

    <!-- Descrição -->
    <div class="form-group">
      <label class="form-label">Descrição</label>
      <textarea class="form-textarea" id="np-desc" placeholder="Descreva o escopo ou objetivo deste projeto…" maxlength="600" rows="3"></textarea>
      <div class="np-desc-count"><span id="np-desc-len">0</span>/600</div>
    </div>

    <!-- Status inicial -->
    <div class="form-group">
      <label class="form-label">Status Inicial</label>
      <select class="form-select" id="np-status">
        <option value="em-andamento">Em Andamento</option>
        <option value="aguardando-cliente">Aguardando Cliente</option>
        <option value="em-revisao">Em Revisão</option>
        <option value="concluido">Concluído</option>
        <option value="pausado">Pausado</option>
      </select>
    </div>

    <!-- Cliente (opcional) -->
    <div class="form-group">
      <label class="form-label">
        Cliente
        <span style="font-size:.68rem;color:var(--muted);font-weight:400;margin-left:.4rem;letter-spacing:0;text-transform:none">(opcional — pode ser adicionado depois)</span>
      </label>

      <div id="usersLoadingMsg" class="users-loading" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .8s linear infinite;display:inline-block;margin-right:.4rem"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Carregando usuários…
      </div>

      <select class="form-select" id="np-client-select" style="display:none">
        <option value="">— Sem cliente (atribuir depois) —</option>
      </select>

      <!-- Preview do cliente selecionado -->
      <div class="client-preview" id="clientPreview">
        <div class="client-preview-avatar" id="clientAvatar"></div>
        <div>
          <div class="client-preview-name" id="clientPreviewName"></div>
          <div class="client-preview-email" id="clientPreviewEmail"></div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave">Criar Projeto</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  try { firebase.initializeApp(firebaseConfig); } catch(e) {}

  const auth = firebase.auth();
  const db   = firebase.firestore();
  let allProjects = [], allUsers = [], unsub;

  showLoading(true);

  auth.onAuthStateChanged(async user => {
    if (!user) { location.href = '../login.html'; return; }

    const data = await resolveUserData(user);
    console.log('[trovalim] uid:', user.uid, 'email:', user.email, 'dados encontrados:', JSON.stringify(data));

    if (normRole(data.role) !== 'admin') { location.href = '../portal/'; return; }

    document.getElementById('userName').textContent = data.name || user.email;

    unsub = db.collection('projects').orderBy('createdAt', 'desc').onSnapshot(s => {
      showLoading(false);
      allProjects = s.docs.map(d => ({ id: d.id, ...d.data() }));
      applyFilters();
    }, () => showLoading(false));
  });

  /* ── FILTERS ── */
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('statusFilter').addEventListener('change', applyFilters);

  function applyFilters() {
    const q  = document.getElementById('searchInput').value.trim().toLowerCase();
    const st = document.getElementById('statusFilter').value;
    let list = allProjects;
    if (q)  list = list.filter(p =>
      p.name?.toLowerCase().includes(q) ||
      p.clientName?.toLowerCase().includes(q) ||
      p.description?.toLowerCase().includes(q) ||
      p.branding?.companyName?.toLowerCase().includes(q));
    if (st) list = list.filter(p => p.status === st);
    renderTable(list);
  }

  function renderTable(list) {
    const tbody = document.getElementById('projectsBody');
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-state-emoji">📋</div><div class="empty-state-text">Nenhum projeto encontrado</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(p => `
      <tr>
        <td>
          <div style="font-size:.85rem;font-weight:500;color:var(--graphite)">${esc(p.branding?.companyName || p.clientName || '—')}</div>
          ${p.clientEmail ? `<div style="font-size:.72rem;color:var(--muted)">${esc(p.clientEmail)}</div>` : ''}
        </td>
        <td style="font-weight:500;max-width:200px">${esc(p.name)}</td>
        <td style="max-width:220px">
          <div style="font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.description||'')}">
            ${p.description ? esc(p.description) : '<span style="opacity:.4">—</span>'}
          </div>
        </td>
        <td>${statusBadge(p.status)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:.5rem">
            <div class="progress-bar" style="flex:1">
              <div class="progress-fill" style="width:${p.progress||0}%;background:${p.branding?.primaryColor||'var(--gold)'}"></div>
            </div>
            <span style="font-size:.72rem;color:var(--muted);flex-shrink:0">${p.progress||0}%</span>
          </div>
        </td>
        <td><a href="projeto.html?id=${p.id}" class="link-btn">Gerenciar →</a></td>
      </tr>`).join('');
  }

  /* ── MODAL ── */
  document.getElementById('newProjectBtn').addEventListener('click', openModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('newProjectModal').addEventListener('click', e => {
    if (e.target === document.getElementById('newProjectModal')) closeModal();
  });

  // Description counter
  document.getElementById('np-desc').addEventListener('input', e => {
    document.getElementById('np-desc-len').textContent = e.target.value.length;
  });

  // Client preview on select change
  document.getElementById('np-client-select').addEventListener('change', updateClientPreview);

  async function openModal() {
    // Reset fields
    document.getElementById('np-name').value   = '';
    document.getElementById('np-desc').value   = '';
    document.getElementById('np-desc-len').textContent = '0';
    document.getElementById('np-status').value = 'em-andamento';
    hideModalErr();
    hideClientPreview();

    document.getElementById('newProjectModal').classList.add('show');
    document.getElementById('np-name').focus();

    // Load users
    await loadUsers();
  }

  function closeModal() {
    document.getElementById('newProjectModal').classList.remove('show');
  }

  async function loadUsers() {
    const sel     = document.getElementById('np-client-select');
    const loadMsg = document.getElementById('usersLoadingMsg');

    sel.style.display     = 'none';
    loadMsg.style.display = 'block';

    try {
      const snap = await db.collection('users').get();
      allUsers = snap.docs.map(d => ({ uid: d.id, ...d.data() }))
                          .filter(u => u.role !== 'admin')
                          .sort((a, b) => (a.name || a.email || '').localeCompare(b.name || b.email || ''));

      sel.innerHTML = `<option value="">— Sem cliente (atribuir depois) —</option>` +
        allUsers.map(u =>
          `<option value="${u.uid}">${esc(u.name || u.email)}${u.name && u.email ? ' — ' + esc(u.email) : ''}</option>`
        ).join('');

      sel.value = '';
    } catch(e) {
      sel.innerHTML = `<option value="">— Erro ao carregar usuários —</option>`;
    }

    loadMsg.style.display = 'none';
    sel.style.display     = 'block';
  }

  function updateClientPreview() {
    const sel = document.getElementById('np-client-select');
    const uid = sel.value;

    if (!uid) { hideClientPreview(); return; }

    const user = allUsers.find(u => u.uid === uid);
    if (!user) { hideClientPreview(); return; }

    const name   = user.name  || user.email || '';
    const email  = user.email || '';
    const initials = name.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';

    document.getElementById('clientAvatar').textContent      = initials;
    document.getElementById('clientPreviewName').textContent = name;
    document.getElementById('clientPreviewEmail').textContent = email;
    document.getElementById('clientPreview').classList.add('show');
  }

  function hideClientPreview() {
    document.getElementById('clientPreview').classList.remove('show');
  }

  document.getElementById('modalSave').addEventListener('click', async () => {
    const name   = document.getElementById('np-name').value.trim();
    const desc   = document.getElementById('np-desc').value.trim();
    const status = document.getElementById('np-status').value;
    const uid    = document.getElementById('np-client-select').value;

    if (!name) { showModalErr('O nome do projeto é obrigatório.'); return; }

    const btn = document.getElementById('modalSave');
    btn.disabled = true; btn.textContent = 'Criando…';

    // Resolve client info from selected user
    let clientName  = '';
    let clientEmail = '';
    let ownerId     = null;

    if (uid) {
      const user  = allUsers.find(u => u.uid === uid);
      ownerId     = uid;
      clientName  = user?.name  || user?.email || '';
      clientEmail = user?.email || '';
    }

    try {
      const ref = await db.collection('projects').add({
        name,
        description: desc || '',
        clientName,
        clientEmail,
        ownerId,
        status,
        progress:  0,
        steps:     [],
        branding:  null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      closeModal();
      location.href = `projeto.html?id=${ref.id}`;
    } catch(e) {
      showModalErr('Erro ao criar projeto. Tente novamente.');
      btn.disabled = false; btn.textContent = 'Criar Projeto';
    }
  });

  function showModalErr(msg) {
    const el = document.getElementById('modalErr');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideModalErr() { document.getElementById('modalErr').classList.remove('show'); }

  /* ── HELPERS ── */
  function statusBadge(s) {
    const map = {
      'em-andamento':       { l: 'Em Andamento',       bg: '#DBEAFE', c: '#1D4ED8' },
      'aguardando-cliente': { l: 'Aguardando Cliente', bg: '#FEF3C7', c: '#B45309' },
      'em-revisao':         { l: 'Em Revisão',         bg: '#EDE9FE', c: '#6D28D9' },
      'concluido':          { l: 'Concluído',           bg: '#D1FAE5', c: '#065F46' },
      'pausado':            { l: 'Pausado',             bg: '#F3F4F6', c: '#374151' },
    };
    const v = map[s] || { l: s||'—', bg: '#F3F4F6', c: '#374151' };
    return `<span class="badge" style="background:${v.bg};color:${v.c}">${v.l}</span>`;
  }

  function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('show', v); }

  async function resolveUserData(user) {
    let snap = await db.collection('users').doc(user.uid).get().catch(() => null);
    if (snap?.exists) return snap.data() || {};
    const q = await db.collection('users').where('email', '==', user.email).limit(1).get().catch(() => null);
    if (q && !q.empty) return q.docs[0].data() || {};
    snap = await db.collection('users').doc(user.email).get().catch(() => null);
    if (snap?.exists) return snap.data() || {};
    return {};
  }

  function normRole(role) {
    return String(role || '').trim().toLowerCase();
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    if (unsub) unsub();
    auth.signOut().then(() => location.href = '../login.html');
  });
</script>
</body>
</html>
