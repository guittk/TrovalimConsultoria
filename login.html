<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Trovalim</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --wine: #3D0B12; --wine-dark: #1A0608;
      --gold: #C9A96E; --gold-light: #E8D5A3;
      --cream: #F9F6F0; --graphite: #2C2C2C; --muted: #6B6B6B;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--wine-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(201,169,110,.07) 0%, transparent 65%);
      pointer-events: none;
    }
    .login-wrap {
      background: var(--cream);
      width: 100%;
      max-width: 420px;
      padding: 3rem 2.5rem;
      position: relative;
    }
    .login-wrap::after {
      content: '';
      position: absolute;
      top: 14px; left: 14px; right: -14px; bottom: -14px;
      border: 1px solid rgba(201,169,110,.28);
      z-index: -1;
      pointer-events: none;
    }
    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.25rem;
    }
    .login-logo img {
      width: 72px; height: 72px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .login-logo-name {
      font-family: var(--serif);
      font-size: 1.45rem;
      color: var(--wine);
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .login-logo-sub {
      font-size: .63rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: .35rem;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,.4), transparent);
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .45rem;
      font-weight: 500;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: .82rem 1rem;
      border: 1px solid rgba(0,0,0,.12);
      background: #fff;
      font-family: var(--sans);
      font-size: .9rem;
      color: var(--graphite);
      margin-bottom: 1.2rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      border-color: var(--gold);
    }
    .btn-login {
      width: 100%;
      background: var(--wine);
      color: var(--gold);
      font-family: var(--sans);
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 1rem;
      border: none;
      cursor: pointer;
      transition: background .3s;
      margin-top: .35rem;
    }
    .btn-login:hover { background: var(--wine-dark); }
    .btn-login:disabled { opacity: .55; cursor: not-allowed; }
    .error-msg {
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      color: #DC2626;
      padding: .72rem 1rem;
      font-size: .8rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.show { display: block; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.85rem;
      font-size: .72rem;
      letter-spacing: .1em;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--wine); }
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,6,8,.65);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 42px; height: 42px;
      border: 2px solid rgba(201,169,110,.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<div class="login-wrap">
  <div class="login-logo">
    <img src="logo_gt.png" alt="Trovalim">
    <div class="login-logo-name">Trovalim</div>
    <div class="login-logo-sub">Portal do Cliente</div>
  </div>
  <div class="divider"></div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm" autocomplete="on">
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>

    <label for="password">Senha</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

    <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
  </form>

  <a href="index.html" class="back-link">← Voltar ao site</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  try { firebase.initializeApp(firebaseConfig); } catch(e) { /* already initialized */ }

  const auth = firebase.auth();
  const db   = firebase.firestore();

  showLoading(true);

  auth.onAuthStateChanged(async user => {
    if (!user) { showLoading(false); return; }
    try {
      const role = await resolveRole(user);
      window.location.href = role === 'admin' ? 'admin/' : 'portal/';
    } catch(e) { showLoading(false); }
  });

  async function resolveRole(user) {
    let snap = await db.collection('users').doc(user.uid).get().catch(() => null);
    if (snap?.exists) return snap.data()?.role || null;
    const q = await db.collection('users').where('email', '==', user.email).limit(1).get().catch(() => null);
    return q && !q.empty ? q.docs[0].data()?.role || null : null;
  }

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    hideError();
    showLoading(true);
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch(err) {
      showLoading(false);
      showError(errMsg(err.code));
    }
  });

  function showLoading(v) {
    document.getElementById('loadingOverlay').classList.toggle('show', v);
    document.getElementById('loginBtn').disabled = v;
  }
  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideError() { document.getElementById('errorMsg').classList.remove('show'); }
  function errMsg(code) {
    const m = {
      'auth/user-not-found': 'Usuário não encontrado.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/invalid-email': 'E-mail inválido.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/too-many-requests': 'Muitas tentativas. Tente novamente mais tarde.',
    };
    return m[code] || 'Erro ao entrar. Tente novamente.';
  }
</script>
</body>
</html>
