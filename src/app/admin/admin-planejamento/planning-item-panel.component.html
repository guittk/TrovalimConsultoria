<div class="plan-panel-backdrop" (click)="close()"></div>
<aside class="plan-panel">
  <button type="button" class="modal-close" style="position:absolute;top:1.25rem;right:1.25rem" (click)="close()">✕</button>

  <input
    class="plan-panel-name"
    [value]="item.nome"
    (blur)="onNameBlur($any($event.target).value)"
  >

  <div class="plan-panel-row">
    <span class="form-label" style="margin-bottom:0">Status</span>
    <app-planning-status-select [value]="item.status" (valueChange)="update({ status: $event })" />
  </div>

  <div class="plan-panel-row">
    <span class="form-label" style="margin-bottom:0">Prioridade</span>
    <app-planning-priority-stars [value]="item.prioridade" (valueChange)="update({ prioridade: $event })" />
  </div>

  <div class="plan-panel-row">
    <span class="form-label" style="margin-bottom:0">Responsáveis</span>
    <app-planning-assignee-select [value]="item.assigneeIds || []" [staff]="staff" (valueChange)="update({ assigneeIds: $event })" />
  </div>

  <div class="plan-panel-row">
    <span class="form-label" style="margin-bottom:0">Prazo</span>
    <input
      type="date"
      class="form-input"
      style="width:auto"
      [value]="item.dueDate || ''"
      (change)="update({ dueDate: $any($event.target).value || null })"
    >
  </div>

  <div class="form-group" style="margin-top:1.25rem">
    <label class="form-label">Descrição</label>
    <textarea
      class="form-textarea"
      rows="4"
      [value]="item.descricao || ''"
      (blur)="onDescricaoBlur($any($event.target).value)"
      placeholder="Sem descrição"
    ></textarea>
  </div>

  <div class="form-group">
    <label class="form-label">Anexos</label>
    @if (item.anexos?.length) {
      <div style="display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem">
        @for (a of item.anexos; track a.path) {
          <div class="file-item" style="padding:.5rem .7rem">
            <div class="file-info">
              <a class="file-name" [href]="a.url" target="_blank" rel="noopener">{{ a.nome }}</a>
            </div>
            <button type="button" class="btn-icon danger" (click)="removeAttachment(a)" title="Remover">✕</button>
          </div>
        }
      </div>
    }
    <label class="btn btn-outline btn-sm" style="cursor:pointer">
      {{ uploading() ? 'Enviando...' : '+ Anexar arquivo' }}
      <input type="file" style="display:none" (change)="handleUpload($event)" [disabled]="uploading()">
    </label>
    @if (uploadErr()) { <div class="form-help" style="color:var(--danger)">{{ uploadErr() }}</div> }
  </div>

  @if (!item.parentId) {
    <div class="form-group">
      <label class="form-label">Sub-itens</label>
      <div style="display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem">
        @for (sub of subitems; track sub.id) {
          <div class="step-item" style="margin-bottom:0">
            <input type="checkbox" class="step-check" [checked]="sub.status === 'done'" (change)="toggleSubitemDone(sub)">
            <span style="flex:1;font-size:.85rem" [style.textDecoration]="sub.status === 'done' ? 'line-through' : 'none'" [style.opacity]="sub.status === 'done' ? .6 : 1">{{ sub.nome }}</span>
            <button type="button" class="btn-icon danger" (click)="removeSubitem(sub)" title="Excluir">✕</button>
          </div>
        }
      </div>
      <div style="display:flex;gap:.5rem">
        <input
          class="form-input"
          placeholder="+ Adicionar sub-item"
          [ngModel]="newSubitemName()"
          (ngModelChange)="newSubitemName.set($event)"
          (keydown.enter)="addSubitem()"
        >
        <button type="button" class="btn btn-outline btn-sm" (click)="addSubitem()">Adicionar</button>
      </div>
    </div>
  }

  <div class="modal-footer" style="border-top:1px solid var(--border);padding-top:1.25rem">
    <button type="button" class="btn-danger-ghost" (click)="handleDelete()">Excluir</button>
  </div>
</aside>
