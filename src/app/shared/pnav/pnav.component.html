<nav class="pnav">
  <div class="pnav-left">
    <a [routerLink]="logoLink" class="pnav-logo">
      <img src="logo_gt.png" alt="Trovalim">
      <span class="pnav-logo-text">Trovalim</span>
    </a>
    <div class="pnav-sep"></div>
    @if (visibleTabs.length) {
      <div class="pnav-tabs">
        @for (tab of visibleTabs; track tab.key) {
          <a [routerLink]="tab.path" class="pnav-tab" [class.active]="tab.key === activeSection">{{ tab.label }}</a>
        }
      </div>
    } @else {
      <span class="pnav-section">{{ sectionLabel }}</span>
    }
  </div>
  <div class="pnav-right">
    <div class="pnav-user">
      <span class="pnav-name">{{ userName }}</span>
      <button class="btn-logout" (click)="logout()">Sair</button>
    </div>
    @if (visibleTabs.length) {
      <button
        class="pnav-menu-btn"
        [class.open]="mobileMenuOpen()"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Abrir menu"
      >
        <span></span><span></span><span></span>
      </button>
    }
  </div>
</nav>

@if (mobileMenuOpen()) {
  <div class="pnav-mobile-backdrop" (click)="closeMobileMenu()"></div>
  <div class="pnav-mobile-menu">
    @for (tab of visibleTabs; track tab.key) {
      <a
        [routerLink]="tab.path"
        class="pnav-mobile-link"
        [class.active]="tab.key === activeSection"
        (click)="closeMobileMenu()"
      >{{ tab.label }}</a>
    }
  </div>
}
