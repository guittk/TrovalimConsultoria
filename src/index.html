  <!-- Dados estruturados para busca (organização, pessoa e FAQ). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Trovalim Consultoria",
    "description": "Consultoria de RH: recrutamento por competência, desenvolvimento de liderança, estruturação de cargos e salários, gestão estratégica de pessoas e orientação de carreira.",
    "url": "https://geovana-trovalim-prod.web.app/",
    "image": "https://geovana-trovalim-prod.web.app/og-image.png",
    "areaServed": "BR",
    "availableLanguage": "pt-BR",
    "knowsAbout": [
      "Recrutamento e seleção por competência",
      "Desenvolvimento de lideranças",
      "Estruturação de cargos e salários",
      "Gestão estratégica de pessoas",
      "Orientação de carreira"
    ],
    "sameAs": [
      "https://www.linkedin.com/in/geovana-trovalim",
      "https://www.instagram.com/consultoria_trovalim"
    ],
    "founder": {
      "@type": "Person",
      "name": "Geovana Trovalim",
      "jobTitle": "Consultora de RH",
      "image": "https://geovana-trovalim-prod.web.app/foto_geovana.jpeg",
      "worksFor": { "@type": "Organization", "name": "Trovalim Consultoria" }
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Qual a diferença entre recrutamento por competência e um processo tradicional?",
        "acceptedAnswer": { "@type": "Answer", "text": "No processo tradicional, a triagem gira em torno do currículo e da experiência declarada. No recrutamento por competência, avaliamos também competências comportamentais, fit cultural e potencial, o que reduz o risco de uma contratação tecnicamente correta, mas desalinhada com a cultura e os objetivos do negócio." }
      },
      {
        "@type": "Question",
        "name": "Atende profissionais individuais ou só empresas?",
        "acceptedAnswer": { "@type": "Answer", "text": "Os dois. Para empresas, a atuação é de consultoria de RH: recrutamento por competência, avaliação comportamental, cargos e salários, gestão estratégica de pessoas, desenvolvimento humano e organizacional e formação de lideranças. Para profissionais, há orientação de carreira, consultoria de currículo, otimização de LinkedIn, psicologia aplicada ao trabalho e avaliação de perfil comportamental." }
      },
      {
        "@type": "Question",
        "name": "O acompanhamento termina quando o candidato é contratado?",
        "acceptedAnswer": { "@type": "Answer", "text": "Não. O acompanhamento vai do briefing até a integração da pessoa contratada, com comunicação transparente em cada etapa do processo." }
      },
      {
        "@type": "Question",
        "name": "Como começa uma conversa?",
        "acceptedAnswer": { "@type": "Answer", "text": "Pelo WhatsApp ou e-mail, com uma escuta inicial sobre o seu contexto. Antes de qualquer proposta técnica, o primeiro passo é entender o desafio real. Só depois desenhamos o caminho." }
      }
    ]
  }
  </script>

  <!--
    Aplica o tema guardado ANTES do primeiro paint. Sem isto, a página
    nasceria no tema claro e piscaria pro escuro só quando o Angular
    subisse. Mantém a mesma chave do ThemeService (core/theme.service.ts).
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('trovalim.theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
